<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Loophole for Ableton Live</title>
  <desc id="description">A dark social card with an amber loop mark, a sequencer grid, and the words Loophole, MCP bridge for Ableton Live.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#110f0b"/>
      <stop offset="1" stop-color="#2b1d0b"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1">
      <stop stop-color="#f5c66b"/>
      <stop offset="1" stop-color="#d77b20"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#f7dda430" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <rect x="34" y="34" width="1132" height="562" rx="28" fill="url(#grid)" stroke="#f6d797" stroke-opacity=".28"/>
  <g opacity=".58">
    <path d="M742 132h322M742 196h260M742 260h372M742 324h226M742 388h330M742 452h280" stroke="#f7dda4" stroke-opacity=".34" stroke-width="4" stroke-linecap="round"/>
    <circle cx="804" cy="132" r="9" fill="#f0a339"/><circle cx="949" cy="196" r="9" fill="#f0a339"/><circle cx="891" cy="260" r="9" fill="#f0a339"/><circle cx="1024" cy="324" r="9" fill="#f0a339"/><circle cx="826" cy="388" r="9" fill="#f0a339"/><circle cx="974" cy="452" r="9" fill="#f0a339"/>
  </g>
  <g filter="url(#glow)">
    <path d="M156 139h103v185c0 47 28 76 73 76 37 0 63-19 75-51l89 36c-27 66-88 100-164 100-112 0-176-64-176-165V139Z" fill="url(#amber)"/>
    <circle cx="460" cy="207" r="73" fill="none" stroke="#f8d89c" stroke-width="28"/>
    <path d="M508 254 575 321" stroke="#f8d89c" stroke-width="28" stroke-linecap="round"/>
  </g>
  <text x="144" y="514" fill="#fff7e8" font-family="Arial, Helvetica, sans-serif" font-size="83" font-weight="700" letter-spacing="4">LOOPHOLE</text>
  <text x="149" y="558" fill="#f6ca76" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" letter-spacing="3">MCP BRIDGE FOR ABLETON LIVE</text>
</svg>
