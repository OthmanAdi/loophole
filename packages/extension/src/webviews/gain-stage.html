<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gain Stage</title>
    <script>
      const LOOPHOLE = /*__LOOPHOLE_DATA__*/ {};
      const isWebKit =
        window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.live;
      const isWebView2 = window.chrome && window.chrome.webview;
      const review = LOOPHOLE.mode === 'review';

      function closeWithResult(result) {
        const message = { method: 'close_and_send', params: [JSON.stringify(result)] };
        if (isWebKit) window.webkit.messageHandlers.live.postMessage(message);
        else if (isWebView2) window.chrome.webview.postMessage(message);
      }

      function submit() {
        if (review) return closeWithResult({ phase: 'apply' });
        const targetDb = Number(document.getElementById('target').value);
        const trackIds = Array.from(document.querySelectorAll('input[data-track]:checked')).map(
          (el) => el.getAttribute('data-track'),
        );
        closeWithResult({ phase: 'analyze', targetDb, trackIds });
      }

      function cancel() {
        closeWithResult({ phase: 'cancel' });
      }

      function fmt(value) {
        return Number.isFinite(value) ? value.toFixed(1) : '—';
      }

      document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('title').textContent = review
          ? 'Review Gain Stage Plan'
          : 'Gain Stage';
        document.getElementById('action').textContent = review
          ? 'Apply proposed trims'
          : 'Measure tracks';
        const headers = document.getElementById('headers');
        const rows = document.getElementById('rows');
        if (review) {
          headers.innerHTML =
            '<th>Track</th><th>Peak</th><th>RMS</th><th>Crest</th><th>Trim</th><th>Result</th>';
          document.getElementById('target-row').textContent =
            `Target ${LOOPHOLE.targetDb} dBFS RMS. Nothing has been written.`;
          for (const proposal of Array.isArray(LOOPHOLE.proposals) ? LOOPHOLE.proposals : []) {
            const tr = document.createElement('tr');
            for (const value of [
              proposal.track,
              fmt(proposal.peakDb),
              fmt(proposal.rmsDb),
              fmt(proposal.crest),
              fmt(proposal.trimDb),
              proposal.status === 'silence' ? 'Silence · no change' : 'Proposed',
            ]) {
              const td = document.createElement('td');
              td.textContent = String(value);
              tr.appendChild(td);
            }
            rows.appendChild(tr);
          }
          return;
        }
        headers.innerHTML = '<th>Stage</th><th>Track</th>';
        const select = document.getElementById('target');
        for (const target of Array.isArray(LOOPHOLE.targets) ? LOOPHOLE.targets : [-18, -20, -12]) {
          const option = document.createElement('option');
          option.value = String(target);
          option.textContent = `${target} dBFS RMS`;
          option.selected = Number(target) === -18;
          select.appendChild(option);
        }
        for (const track of Array.isArray(LOOPHOLE.tracks) ? LOOPHOLE.tracks : []) {
          const tr = document.createElement('tr');
          const check = document.createElement('input');
          check.type = 'checkbox';
          check.checked = true;
          check.setAttribute('data-track', track.id);
          const first = document.createElement('td');
          first.appendChild(check);
          const name = document.createElement('td');
          name.textContent = track.name;
          tr.append(first, name);
          rows.appendChild(tr);
        }
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') submit();
          if (event.key === 'Escape') cancel();
        });
      });
    </script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      *:not(dialog) {
        margin: 0;
      }
      :root {
        --bg: hsl(0 0% 21%);
        --fg: hsl(0 0% 71%);
        --muted: hsl(0 0% 41%);
        --border: hsl(0 0% 7%);
        --control: hsl(0 0% 16%);
        --accent: hsl(31 100% 67%);
      }
      html {
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font:
          500 11.5px 'AbletonSansSmall',
          sans-serif;
      }
      body {
        height: 100%;
        padding: 1.25em;
        display: flex;
        flex-direction: column;
        gap: 0.75em;
      }
      .title {
        font-size: 1.1rem;
      }
      .target-row {
        color: var(--muted);
        min-height: 22px;
        display: flex;
        align-items: center;
        gap: 0.5em;
      }
      select,
      button {
        font: inherit;
      }
      select {
        background: var(--control);
        color: var(--fg);
        border: 1px solid var(--border);
        height: 22px;
      }
      .table-wrap {
        flex: 1;
        overflow: auto;
        border: 1px solid var(--border);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 0.3em 0.5em;
        border-bottom: 1px solid var(--border);
      }
      th {
        color: var(--muted);
        position: sticky;
        top: 0;
        background: var(--control);
      }
      .buttons {
        display: flex;
        justify-content: flex-end;
        gap: 0.5em;
      }
      button {
        color: var(--fg);
        background: var(--control);
        border: 1px solid var(--border);
        border-radius: 1em;
        height: 22px;
        padding: 0 1em;
        cursor: pointer;
      }
      button:active {
        background: var(--accent);
        color: var(--border);
      }
    </style>
  </head>
  <body>
    <div id="title" class="title"></div>
    <div id="target-row" class="target-row">
      <label for="target">Target</label
      ><select id="target"></select>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr id="headers"></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="buttons">
      <button onclick="cancel()">Cancel</button><button id="action" onclick="submit()"></button>
    </div>
  </body>
</html>
