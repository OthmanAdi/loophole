name: Docs tools drift

# The §1.9 drift guard: tools.json is a projection of the running MCP server, so
# a stale committed copy must fail the build. This is a SEPARATE, docs-scoped
# workflow (it does not touch the lean main CI). It rebuilds the bridge,
# regenerates docs/src/data/tools.json, and fails if the committed copy differs.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs-tools-drift.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'docs/package.json'
      - 'docs/package-lock.json'
      - 'docs/scripts/dump-tools.ts'
      - 'docs/src/data/tools.json'
      - 'packages/mcp/**'
      - 'packages/core/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/docs-tools-drift.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'docs/package.json'
      - 'docs/package-lock.json'
      - 'docs/scripts/dump-tools.ts'
      - 'docs/src/data/tools.json'
      - 'packages/mcp/**'
      - 'packages/core/**'

permissions:
  contents: read

concurrency:
  group: docs-tools-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: tools.json is in sync with the server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      # dump-tools imports buildServer from the built mcp bundle, so build it first.
      - name: Build the MCP bridge
        run: pnpm --filter @othmanadi/ableton-mcp build

      # Install docs deps and regenerate tools.json from the running server.
      - name: Install docs dependencies
        working-directory: docs
        run: npm ci --ignore-scripts

      - name: Audit docs production dependencies
        working-directory: docs
        run: npm audit --omit=dev --audit-level=high

      - name: Regenerate tools.json
        working-directory: docs
        run: npm run dump-tools

      # Fail if the regenerated file differs from the committed copy.
      - name: Fail on stale tools.json
        run: git diff --exit-code docs/src/data/tools.json
